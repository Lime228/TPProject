name: API Tests and Deployment

on:
  push:
    paths:
      - 'backend/**'
      - 'api-tests/**'
      - '.github/workflows/dart-tests.yml'
      - 'docker-compose.template.yml'

env:
  CI_API_PORT: 8081       # Порт для тестов в CI
  PROD_API_PORT: 8090     # Порт для production
  DOCKER_COMPOSE_VERSION: "2.23.0"
  POSTGRES_TIMEOUT: 120
  API_TIMEOUT: 180
  PRODUCTION_DIR: "/root/zadachok"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Check db/init.sql exists
        run: |
          if [ ! -f db/init.sql ]; then
            echo "❌ db/init.sql not found!"
            exit 1
          fi
          echo "✅ Found db/init.sql"

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dart SDK
        run: |
          echo "📦 Installing Dart SDK..."
          sudo apt update -y
          sudo apt install -y apt-transport-https
          sudo sh -c 'wget -qO- https://storage.googleapis.com/download.dartlang.org/linux/debian/dart_stable.list > /etc/apt/sources.list.d/dart_stable.list'
          sudo apt update -y
          sudo apt install -y dart
          echo "✅ Dart SDK installed."

      - name: Build API
        working-directory: ./backend/api
        run: |
          echo "🏗 Building API..."
          mvn clean package -Dspring.profiles.active=ci -DskipTests
          echo "✅ API build completed."

      - name: Start Docker Compose (CI)
        env:
          DB_PASSWORD: zadachok
          JWT_SECRET: defaultSecret
        run: |
          echo "🐳 Starting CI containers (port ${{ env.CI_API_PORT }})..."
          docker-compose -f docker-compose.template.yml up -d --build
          echo "✅ CI containers started."

      - name: Install Postgres client
        run: |
          echo "📦 Installing PostgreSQL client..."
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          echo "✅ PostgreSQL client installed."

      - name: Wait for Database Health
        run: |
          echo "⏳ Waiting for Database container to become healthy..."
          ATTEMPTS=0
          until [ "$(docker inspect -f '{{.State.Health.Status}}' tpproject-db)" == "healthy" ]; do
            if [ $ATTEMPTS -ge 20 ]; then
              echo "❌ Database did not become healthy in time."
              docker-compose -f docker-compose.template.yml logs db
              exit 1
            fi
            echo "⏳ Database not healthy yet, waiting 5 seconds..."
            sleep 5
            ATTEMPTS=$((ATTEMPTS+1))
          done
          echo "✅ Database container is healthy."

      - name: Check Database Initialization
        env:
          PGPASSWORD: zadachok
        run: |
          echo "🔎 Checking database tables..."
          if psql -h localhost -U zadachok -d zadachok_db -c "\dt tp.*"; then
            echo "✅ Database tables found."
          else
            echo "❌ Failed to check tables."
            exit 1
          fi

      - name: Wait for API (CI)
        env:
          API_TIMEOUT: ${{ env.API_TIMEOUT }}
        run: |
          echo "⏳ Waiting for CI API (port ${{ env.CI_API_PORT }}) to become healthy..."
          timeout ${API_TIMEOUT}s bash -c '
            docker-compose -f docker-compose.template.yml logs --tail=20 api
            sleep 15
            curl -s http://localhost:${{ env.CI_API_PORT }}/actuator/health
            docker-compose -f docker-compose.template.yml logs --tail=20 api
          '

      - name: Run Dart Tests
        working-directory: ./api-tests
        env:
          API_URL: "http://localhost:${{ env.CI_API_PORT }}"
        run: |
          echo "🏁 Running Dart tests against port ${{ env.CI_API_PORT }}..."
          dart pub get
          dart test APItests.dart
          echo "✅ Dart tests completed."

      - name: Show Logs on Failure
        if: failure()
        run: |
          echo "🚨 Database logs:"
          docker-compose -f docker-compose.template.yml logs db || echo "No db logs available."
          echo "🚨 API logs:"
          docker-compose -f docker-compose.template.yml logs api || echo "No api logs available."

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Verify server connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            echo 'Server info:';
            uname -a;
            echo 'Docker version:';
            docker --version;
            echo 'Docker Compose version:';
            docker-compose --version;
            echo 'Current directory:';
            ls -la ${{ env.PRODUCTION_DIR }}
          "

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "echo 'Connection successful!'"

      - name: Selective Deploy
        env:
          GIT_BRANCH: main
          COMPOSE_FILE: docker-compose.yml
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            set -e
            echo '🚀 Starting selective deployment (port ${{ env.PROD_API_PORT }})...'
            
            # Проверка директории
            if [ ! -d '${{ env.PRODUCTION_DIR }}' ]; then
              echo '❌ Error: Production directory not found!'
              exit 1
            fi
            
            cd ${{ env.PRODUCTION_DIR }} || exit 1
            
            # Временная папка для обновления
            TMP_DIR=$(mktemp -d)
            
            # Клонируем только нужные папки
            git clone --depth 1 --branch $GIT_BRANCH --no-checkout \
              https://github.com/Lime228/TPProject.git $TMP_DIR
            cd $TMP_DIR
            git sparse-checkout init --cone
            git sparse-checkout set backend db
            git checkout
            
            echo '🔄 Syncing backend and db...'
            rsync -av --delete \
              --exclude='config/' \
              --exclude='nginx/' \
              --exclude='docker-compose*' \
              $TMP_DIR/backend/ $TMP_DIR/db/ ${{ env.PRODUCTION_DIR }}/
            
            # Очистка временных файлов
            rm -rf $TMP_DIR
            
            echo '🐳 Rebuilding production containers (port ${{ env.PROD_API_PORT }})...'
            docker-compose -f $COMPOSE_FILE down || echo '⚠️ No containers to stop'
            docker-compose -f $COMPOSE_FILE up -d --build
            
            echo '⏳ Production health check (port ${{ env.PROD_API_PORT }}, 60s timeout)...'
            timeout 60s bash -c '
              while [[ $(curl -s -o /dev/null -w "%{http_code}" localhost:${{ env.PROD_API_PORT }}/actuator/health) != "200" ]]; do
                sleep 5
                echo -n .
              done
            '
            
            echo -e '\n✅ Production deployment completed successfully on port ${{ env.PROD_API_PORT }}!'
          " || { echo '❌ Deployment failed'; exit 1; }

      - name: Verify Production Deployment
        run: |
          echo "Checking production API at ${{ secrets.SERVER_IP }}:${{ env.PROD_API_PORT }}..."
          curl -sSf http://${{ secrets.SERVER_IP }}:${{ env.PROD_API_PORT }}/actuator/health
          echo -e "\n🎉 Production API is healthy and running on port ${{ env.PROD_API_PORT }}!"

      - name: Cleanup CI Containers
        if: always()
        run: |
            echo "🧹 Cleaning up CI Docker containers..."
            docker-compose -f docker-compose.template.yml down -v
            docker system prune -f
            echo "✅ CI cleanup completed."