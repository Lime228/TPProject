name: API Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'api-tests/**'
      - '.github/workflows/dart-tests.yml'
      - 'docker-compose.ci.yml'

env:
  DB_USER: zadachok
  DB_NAME: zadachok_db
  DB_HOST: db
  DB_PORT: 5432
  API_PORT: 8081

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Prepare application properties
        working-directory: ./backend/api
        run: |
          mkdir -p src/main/resources
          cat <<EOF > src/main/resources/application-ci.properties
          spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
          spring.datasource.username=${DB_USER}
          spring.datasource.password=${{ secrets.DB_PASSWORD}}
          
          jwt.secret=${{ secrets.JWT_SECRET}}
          jwt.expiration=86400000
          
          server.port=${API_PORT}
          
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.show-sql=true
          spring.config.activate.on-profile=ci
          EOF

      - name: Build API
        working-directory: ./backend/api
        run: mvn clean package -Dspring.profiles.active=ci -DskipTests

      - name: Start API service
        run: |
          docker-compose -f docker-compose.ci.yml up -d --build
          echo "Waiting for API to start..."
          timeout 120s bash -c 'until curl -s http://localhost:${API_PORT}/actuator/health | grep -q "UP"; do sleep 5; echo "Retrying..."; done'

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          version: "3.4.0"

      - name: Run Dart tests
        working-directory: ./api-tests
        env:
          API_URL: "http://localhost:${{ env.API_PORT }}"
        run: |
          dart pub get
          dart test
