name: API Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'api-tests/**'
      - '.github/workflows/dart-tests.yml'
      - 'docker-compose.ci.yml'

env:
  DB_USER: zadachok
  DB_NAME: zadachok_db
  DB_HOST: db  # Оставляем как 'db' для docker-compose сети
  DB_PORT: 5432
  API_PORT: 8081
  DOCKER_COMPOSE_VERSION: "2.23.0"

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      # Установка Docker и Docker Compose
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
        
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Verify Docker setup
        run: |
          docker --version
          docker-compose --version
          docker info

      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Prepare application properties
        working-directory: ./backend/api
        run: |
          mkdir -p src/main/resources
          cat <<EOF > src/main/resources/application-ci.properties
          spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
          spring.datasource.username=${DB_USER}
          spring.datasource.password=${{ secrets.DB_PASSWORD}}
          
          jwt.secret=${{ secrets.JWT_SECRET}}
          jwt.expiration=86400000
          
          server.port=${API_PORT}
          
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.show-sql=true
          spring.config.activate.on-profile=ci
          EOF

      - name: Build API
        working-directory: ./backend/api
        run: mvn clean package -Dspring.profiles.active=ci -DskipTests

      - name: Start services
        run: |
          docker-compose -f docker-compose.ci.yml up -d --build
          
          echo "Waiting for PostgreSQL..."
          timeout 120s bash -c 'until docker-compose -f docker-compose.ci.yml exec db pg_isready; do sleep 5; echo "Waiting..."; done'
          
          echo "Waiting for API to start..."
          timeout 300s bash -c 'until curl -sSf http://localhost:${API_PORT}/actuator/health >/dev/null; do sleep 5; echo "Waiting..."; done'
          
          docker-compose -f docker-compose.ci.yml ps
          docker-compose -f docker-compose.ci.yml logs api

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          version: "3.4.0"

      - name: Run Dart tests
        working-directory: ./api-tests
        env:
          API_URL: "http://localhost:${{ env.API_PORT }}"
        run: |
          dart pub get
          dart test
