name: API Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'api-tests/**'
      - '.github/workflows/dart-tests.yml'
      - 'docker-compose.template.yml'

env:
  API_PORT: 8081
  DOCKER_COMPOSE_VERSION: "2.23.0"

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      # Установка Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
        
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      # Генерация docker-compose.ci.yml
      - name: Generate docker-compose file
        run: |
          envsubst < docker-compose.template.yml > docker-compose.ci.yml
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      # Проверка (можно удалить после отладки)
      - name: Verify generated file
        run: |
          cat docker-compose.ci.yml | grep -v password  # Безопасный вывод для логов

      # Остальные шаги
      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build API
        working-directory: ./backend/api
        run: mvn clean package -Dspring.profiles.active=ci -DskipTests

      - name: Start services
        run: |
          docker-compose -f docker-compose.ci.yml up -d --build
          
          echo "Waiting for PostgreSQL..."
          timeout 120s bash -c 'until docker-compose -f docker-compose.ci.yml exec db pg_isready; do sleep 5; echo "Waiting..."; done'
          
          echo "Waiting for API to start..."
          timeout 300s bash -c 'until curl -sSf http://localhost:${API_PORT}/actuator/health >/dev/null; do sleep 5; echo "Waiting..."; done'
          
          docker-compose -f docker-compose.ci.yml logs api

      - name: Run Dart tests
        working-directory: ./api-tests
        env:
          API_URL: "http://localhost:${{ env.API_PORT }}"
        run: |
          dart pub get
          dart test
