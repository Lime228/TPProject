name: API Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'api-tests/**'
      - '.github/workflows/dart-tests.yml'
      - 'docker-compose.template.yml'

env:
  API_PORT: 8081
  DOCKER_COMPOSE_VERSION: "2.23.0"
  POSTGRES_TIMEOUT: 120
  API_TIMEOUT: 180

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Check db/init.sql exists
        run: |
          if [ ! -f db/init.sql ]; then
            echo "❌ db/init.sql not found!"
            exit 1
          fi
          echo "✅ Found db/init.sql"

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dart SDK
        run: |
          echo "📦 Installing Dart SDK..."
          sudo apt update -y
          sudo apt install -y apt-transport-https
          sudo sh -c 'wget -qO- https://storage.googleapis.com/download.dartlang.org/linux/debian/dart_stable.list > /etc/apt/sources.list.d/dart_stable.list'
          sudo apt update -y
          sudo apt install -y dart
          echo "✅ Dart SDK installed."

      - name: Build API
        working-directory: ./backend/api
        run: |
          echo "🏗 Building API..."
          mvn clean package -Dspring.profiles.active=ci -DskipTests
          echo "✅ API build completed."

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: api-artifact
          path: ./backend/api/target/zadachok-api.jar

      - name: Start Docker Compose
        env:
          DB_PASSWORD: zadachok
          JWT_SECRET: defaultSecret
        run: |
          echo "🐳 Starting Docker containers..."
          docker-compose -f docker-compose.template.yml up -d --build
          echo "✅ Docker containers started."

      - name: Install Postgres client
        run: |
          echo "📦 Installing PostgreSQL client..."
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          echo "✅ PostgreSQL client installed."

      - name: Wait for Database Health
        run: |
          echo "⏳ Waiting for Database container to become healthy..."
          ATTEMPTS=0
          until [ "$(docker inspect -f '{{.State.Health.Status}}' tpproject-db)" == "healthy" ]; do
            if [ $ATTEMPTS -ge 20 ]; then
              echo "❌ Database did not become healthy in time."
              docker-compose logs db
              exit 1
            fi
            echo "⏳ Database not healthy yet, waiting 5 seconds..."
            sleep 5
            ATTEMPTS=$((ATTEMPTS+1))
          done
          echo "✅ Database container is healthy."

      - name: Check Database Initialization
        env:
          PGPASSWORD: zadachok
        run: |
          echo "🔎 Checking database tables..."
          if psql -h localhost -U zadachok -d zadachok_db -c "\dt tp.*"; then
            echo "✅ Database tables found."
          else
            echo "❌ Failed to check tables."
            exit 1
          fi

      - name: Wait for API
        env:
          API_TIMEOUT: ${{ env.API_TIMEOUT }}
        run: |
          echo "⏳ Waiting for API to become healthy..."
          timeout ${API_TIMEOUT}s bash -c '
          docker-compose -f docker-compose.template.yml logs --tail=20 api
          sleep 15
          docker-compose -f docker-compose.template.yml logs --tail=20 api
          '

      - name: Run Dart Tests
        working-directory: ./api-tests
        env:
          API_URL: "http://localhost:${{ env.API_PORT }}"
        run: |
          echo "🏁 Running Dart tests..."
          dart pub get
          dart test APItests.dart
          echo "✅ Dart tests completed."

      - name: Show Logs on Failure
        if: failure()
        run: |
          echo "🚨 Database logs:"
          docker-compose -f docker-compose.template.yml logs db || echo "No db logs available."
          echo "🚨 API logs:"
          docker-compose -f docker-compose.template.yml logs api || echo "No api logs available."

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up Docker containers..."
          docker-compose -f docker-compose.template.yml down -v
          docker system prune -f
          echo "✅ Cleanup completed."

  deploy-to-branch:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout bob-builder branch
        uses: actions/checkout@v4
        with:
          ref: bob-builder
          fetch-depth: 0

      - name: Download JAR from artifacts
        uses: actions/download-artifact@v3
        with:
          name: api-artifact
          path: ./

      - name: Commit and push JAR
        run: |
          # Удаляем старый JAR (если есть) и копируем новый
          rm -f zadachok-api.jar
          mv ./backend/api/target/zadachok-api.jar ./

          # Настраиваем git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Коммитим и пушим
          git add zadachok-api.jar
          git commit -m "Auto-update: API build from $GITHUB_SHA"
          git push origin bob-builder