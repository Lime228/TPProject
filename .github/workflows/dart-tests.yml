name: API Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'api-tests/**'
      - '.github/workflows/dart-tests.yml'
      - 'docker-compose.template.yml'

env:
  API_PORT: 8081
  DOCKER_COMPOSE_VERSION: "2.23.0"
  POSTGRES_TIMEOUT: 120
  API_TIMEOUT: 180


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Verify init.sql exists
        run: |
          ls -la db/init.sql
          cat db/init.sql | head -n 10

      - name: Generate docker-compose file
        run: |
          cat <<EOF > docker-compose.ci.yml
          version: '3.8'

          services:
            db:
              image: postgres:17
              environment:
                POSTGRES_USER: zadachok
                POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
                POSTGRES_DB: zadachok_db
                POSTGRES_INITDB_ARGS: "--encoding=UTF8"
              volumes:
                - postgres_data:/var/lib/postgresql/data
                - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U zadachok -d zadachok_db"]
                interval: 5s
                timeout: 5s
                retries: 10
              ports:
                - "5432:5432"

            api:
              build:
                context: ./backend
                dockerfile: Dockerfile
              ports:
                - "${{ env.API_PORT }}:8081"
              environment:
                SPRING_PROFILES_ACTIVE: ci
                SERVER_ADDRESS: 0.0.0.0
                SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/zadachok_db?currentSchema=tp
                SPRING_DATASOURCE_USERNAME: zadachok
                SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
                JWT_SECRET: ${{ secrets.JWT_SECRET }}
                SPRING_JPA_HIBERNATE_DDL_AUTO: validate
                SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: tp
              depends_on:
                db:
                  condition: service_healthy
              healthcheck:
                test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
                interval: 10s
                timeout: 5s
                retries: 5

          volumes:
            postgres_data:
          EOF

      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build API
        working-directory: ./backend/api
        run: mvn clean package -Dspring.profiles.active=ci -DskipTests

      - name: Start services with debug
        run: |
          docker-compose -f docker-compose.ci.yml up -d --build
          docker-compose -f docker-compose.ci.yml logs -f db > db.log 2>&1 &
          sleep 15

      - name: Check database initialization
        run: |
          echo "=== Database logs ==="
          cat db.log || echo "No logs available"
          
          echo "=== Checking tables ==="
          docker-compose -f docker-compose.ci.yml exec db psql -U zadachok -d zadachok_db -c "\dt tp.*" || echo "Failed to check tables"

          echo "=== Checking init script execution ==="
          docker-compose -f docker-compose.ci.yml exec db ls -la /docker-entrypoint-initdb.d/

      - name: Wait for services
        run: |
          echo "🔄 Waiting for PostgreSQL..."
          timeout ${{ env.POSTGRES_TIMEOUT }}s bash -c '
            while ! docker-compose -f docker-compose.ci.yml exec db pg_isready -U zadachok; do
              echo "⏳ Waiting for PostgreSQL..."
              sleep 5
            done'

          echo "🔄 Waiting for API..."
          timeout ${{ env.API_TIMEOUT }}s bash -c '
            while ! docker-compose -f docker-compose.ci.yml exec api curl -s http://localhost:8081/actuator/health; do
              echo "⏳ API not ready yet..."
              docker-compose -f docker-compose.ci.yml logs api --tail=20
              sleep 5
            done'

      - name: Run Dart tests
        working-directory: ./api-tests
        env:
          API_URL: "http://localhost:${{ env.API_PORT }}"
        run: |
          dart pub get
          dart test

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.ci.yml down -v
          docker system prune -f

