name: API Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'api-tests/**'
      - '.github/workflows/dart-tests.yml'
      - 'docker-compose.template.yml'

env:
  API_PORT: 8081
  DOCKER_COMPOSE_VERSION: "2.23.0"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Установка Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      # Генерация docker-compose.ci.yml
      - name: Generate docker-compose file
        run: |
          envsubst < docker-compose.template.yml > docker-compose.ci.yml
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      # Установка Java и Maven
      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Сборка приложения
      - name: Build API
        working-directory: ./backend/api
        run: mvn clean package -Dspring.profiles.active=ci -DskipTests

      # Запуск сервисов и проверка
      - name: Start and verify services
        run: |
          # Запуск контейнеров
          docker-compose -f docker-compose.ci.yml up -d --build
          
          # Проверка PostgreSQL
          echo "Waiting for PostgreSQL..."
          timeout 120s bash -c 'until docker-compose -f docker-compose.ci.yml exec db pg_isready -U zadachok -d zadachok_db; do sleep 5; echo "Waiting..."; done'
          
          # Проверка API изнутри сети Docker
          echo "Checking API from inside Docker network..."
          docker-compose -f docker-compose.ci.yml run --rm curl curl -s http://api:8081/actuator/health
          
          # Альтернативная проверка через logs
          echo "API logs:"
          docker-compose -f docker-compose.ci.yml logs api --tail=50
          
          # Проверка проброса порта (для хоста)
          echo "Checking port mapping..."
          docker-compose -f docker-compose.ci.yml ps

      # Запуск Dart тестов
      - name: Run Dart tests
        working-directory: ./api-tests
        env:
          API_URL: "http://localhost:${{ env.API_PORT }}"
        run: |
          dart pub get
          dart test
