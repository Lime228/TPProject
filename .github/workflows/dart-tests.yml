name: API Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'api-tests/**'
      - '.github/workflows/dart-tests.yml'
      - 'docker-compose.ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'  # Кэширование Maven-зависимостей
      - name: Verify project structure
        run: |
          ls -la
          ls -la backend/

      - name: Build API
        working-directory: ./backend/api
        run: mvn clean package  # Используем системный Maven вместо mvnw

      - name: Prepare environment
        run: |
          mkdir -p backend/config
          echo "spring.datasource.url=jdbc:postgresql://db:5432/zadachok_db" > backend/config/application-ci.properties
          echo "spring.datasource.username=zadachok" >> backend/config/application-ci.properties
          echo "spring.datasource.password=secret123" >> backend/config/application-ci.properties

      - name: Start services
        run: |
          docker-compose -f docker-compose.ci.yml up -d --build
          timeout 120s bash -c 'until curl -s http://localhost:8081/actuator/health | grep -q "UP"; do sleep 5; done'

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          version: "3.4.0"

      - name: Run tests
        working-directory: ./api-tests
        env:
          API_URL: "http://localhost:8081"
        run: |
          dart pub get
          dart test
