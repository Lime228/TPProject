name: API Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'api-tests/**'
      - '.github/workflows/dart-tests.yml'
      - 'docker-compose.template.yml'

env:
  API_PORT: 8081
  DOCKER_COMPOSE_VERSION: "2.23.0"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Установка Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      # Генерация docker-compose.ci.yml с curl сервисом
      - name: Generate docker-compose file
        run: |
          cat <<EOF > docker-compose.ci.yml
          version: '3.8'
          
          services:
            db:
              image: postgres:17
              environment:
                POSTGRES_USER: zadachok
                POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
                POSTGRES_DB: zadachok_db
              volumes:
                - postgres_data:/var/lib/postgresql/data
                - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U zadachok -d zadachok_db"]
                interval: 5s
                timeout: 5s
                retries: 5

            api:
              build:
                context: .
                dockerfile: backend/Dockerfile
              ports:
                - "${{ env.API_PORT }}:8081"
              environment:
                SPRING_PROFILES_ACTIVE: ci
                SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/zadachok_db
                SPRING_DATASOURCE_USERNAME: zadachok
                SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
                JWT_SECRET: ${{ secrets.JWT_SECRET }}
              depends_on:
                db:
                  condition: service_healthy

            curl:
              image: curlimages/curl
              network_mode: service:api
              command: sleep infinity
          
          volumes:
            postgres_data:
          EOF

      # Установка Java и Maven
      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Сборка приложения
      - name: Build API
        working-directory: ./backend/api
        run: mvn clean package -Dspring.profiles.active=ci -DskipTests

      # Запуск и проверка сервисов
      - name: Start and verify services
        run: |
          # Запуск контейнеров
          docker-compose -f docker-compose.ci.yml up -d --build
          
          # Ожидание PostgreSQL
          echo "Waiting for PostgreSQL..."
          timeout 120s bash -c 'until docker-compose -f docker-compose.ci.yml exec db pg_isready -U zadachok -d zadachok_db; do sleep 5; echo "Waiting..."; done'
          
          # Проверка API изнутри сети
          echo "Checking API health..."
          docker-compose -f docker-compose.ci.yml exec api curl -s http://localhost:8081/actuator/health || \
            (docker-compose -f docker-compose.ci.yml logs api; exit 1)
          
          # Проверка доступности с хоста
          echo "Checking host access..."
          curl -sSf --retry 5 --retry-delay 5 http://localhost:${{ env.API_PORT }}/actuator/health

      # Запуск Dart тестов
      - name: Run Dart tests
        working-directory: ./api-tests
        env:
          API_URL: "http://localhost:${{ env.API_PORT }}"
        run: |
          dart pub get
          dart test
