name: API Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'api-tests/**'
      - '.github/workflows/dart-tests.yml'
      - 'docker-compose.template.yml'

env:
  API_PORT: 8081
  DOCKER_COMPOSE_VERSION: "2.23.0"
  POSTGRES_TIMEOUT: 120
  API_TIMEOUT: 180

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Check db/init.sql exists
        run: |
          test -f db/init.sql || (echo "❌ db/init.sql not found!" && exit 1)

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build API
        working-directory: ./backend/api
        run: mvn clean package -Dspring.profiles.active=ci -DskipTests

      - name: Start Docker Compose
        run: |
          docker-compose -f docker-compose.template.yml up -d --build

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          timeout ${{ env.POSTGRES_TIMEOUT }}s bash -c '
          until docker-compose exec db pg_isready -U zadachok -d zadachok_db; do
            sleep 5
          done'
        
      - name: Check Database Initialization
        run: |
          docker-compose exec db psql -U zadachok -d zadachok_db -c "\dt tp.*" || echo "❌ Failed to check tables"
          docker-compose exec db ls -la /docker-entrypoint-initdb.d/

      - name: Wait for API
        run: |
          echo "Waiting for API to be healthy..."
          timeout ${{ env.API_TIMEOUT }}s bash -c '
          until docker-compose exec api curl -sf http://localhost:8081/actuator/health; do
            docker-compose logs --tail=20 api
            sleep 5
          done'

      - name: Run Dart Tests
        working-directory: ./api-tests
        env:
          API_URL: "http://localhost:${{ env.API_PORT }}"
        run: |
          dart pub get
          dart test

      - name: Show Logs on Failure
        if: failure()
        run: |
          echo "🚨 Database logs:"
          docker-compose logs db || echo "No db logs"
          echo "🚨 API logs:"
          docker-compose logs api || echo "No api logs"

      - name: Cleanup
        if: always()
        run: |
          docker-compose down -v
          docker system prune -f
