name: API Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'api-tests/**'
      - '.github/workflows/dart-tests.yml'
      - 'docker-compose.ci.yml'

env:
  DB_USER: zadachok
  DB_NAME: zadachok_db
  DB_HOST: db
  DB_PORT: 5432
  API_PORT: 8081

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify project structure
        run: |
          ls -la
          ls -la backend/

      - name: Build API
        working-directory: ./backend/api
        run: mvn clean package

      - name: Prepare environment
        run: |
          mkdir -p backend/config
          cat <<EOF > backend/config/application-ci.properties
          spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
          spring.datasource.username=${DB_USER}
          spring.datasource.password=${{ secrets.DB_PASSWORD}}
          
          jwt.secret=${{ secrets.JWT_SECRET}}
          jwt.expiration=86400000
          
          server.port=${API_PORT}
          spring.config.activate.on-profile=ci
          EOF

      - name: Start services
        run: |
          docker-compose -f docker-compose.ci.yml up -d --build
          echo "Waiting for API to start..."
          timeout 120s bash -c 'until curl -s http://localhost:${API_PORT}/actuator/health | grep -q "UP"; do sleep 5; echo "Retrying..."; done'

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          version: "3.4.0"

      - name: Run tests
        working-directory: ./api-tests
        env:
          API_URL: "http://localhost:${{ env.API_PORT }}"
        run: |
          dart pub get
          dart test
