name: API Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'api-tests/**'
      - '.github/workflows/dart-tests.yml'
      - 'docker-compose.template.yml'

env:
  API_PORT: 8081
  DOCKER_COMPOSE_VERSION: "2.23.0"
  POSTGRES_TIMEOUT: 120
  API_TIMEOUT: 180

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Verify init.sql exists
        run: |
          ls -la db/init.sql
          head -n 10 db/init.sql

      - name: Generate docker-compose file
        run: |
          echo "version: '3.8'" > docker-compose.ci.yml
          echo "services:" >> docker-compose.ci.yml
          echo "  db:" >> docker-compose.ci.yml
          echo "    image: postgres:17" >> docker-compose.ci.yml
          echo "    environment:" >> docker-compose.ci.yml
          echo "      POSTGRES_USER: zadachok" >> docker-compose.ci.yml
          echo "      POSTGRES_PASSWORD: ${SECRET_DB_PASSWORD}" >> docker-compose.ci.yml
          echo "      POSTGRES_DB: zadachok_db" >> docker-compose.ci.yml
          echo "      POSTGRES_INITDB_ARGS: '--encoding=UTF8'" >> docker-compose.ci.yml
          echo "    volumes:" >> docker-compose.ci.yml
          echo "      - postgres_data:/var/lib/postgresql/data" >> docker-compose.ci.yml
          echo "      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql" >> docker-compose.ci.yml
          echo "    healthcheck:" >> docker-compose.ci.yml
          echo "      test: ['CMD-SHELL', 'pg_isready -U zadachok -d zadachok_db']" >> docker-compose.ci.yml
          echo "      interval: 5s" >> docker-compose.ci.yml
          echo "      timeout: 5s" >> docker-compose.ci.yml
          echo "      retries: 10" >> docker-compose.ci.yml
          echo "    ports:" >> docker-compose.ci.yml
          echo "      - '5432:5432'" >> docker-compose.ci.yml
          echo "  api:" >> docker-compose.ci.yml
          echo "    build:" >> docker-compose.ci.yml
          echo "      context: ./backend" >> docker-compose.ci.yml
          echo "      dockerfile: Dockerfile" >> docker-compose.ci.yml
          echo "    ports:" >> docker-compose.ci.yml
          echo "      - '${{ env.API_PORT }}:8081'" >> docker-compose.ci.yml
          echo "    environment:" >> docker-compose.ci.yml
          echo "      SPRING_PROFILES_ACTIVE: ci" >> docker-compose.ci.yml
          echo "      SERVER_ADDRESS: 0.0.0.0" >> docker-compose.ci.yml
          echo "      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/zadachok_db?currentSchema=tp" >> docker-compose.ci.yml
          echo "      SPRING_DATASOURCE_USERNAME: zadachok" >> docker-compose.ci.yml
          echo "      SPRING_DATASOURCE_PASSWORD: ${SECRET_DB_PASSWORD}" >> docker-compose.ci.yml
          echo "      JWT_SECRET: ${SECRET_JWT_SECRET}" >> docker-compose.ci.yml
          echo "      SPRING_JPA_HIBERNATE_DDL_AUTO: validate" >> docker-compose.ci.yml
          echo "      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: tp" >> docker-compose.ci.yml
          echo "    depends_on:" >> docker-compose.ci.yml
          echo "      db:" >> docker-compose.ci.yml
          echo "        condition: service_healthy" >> docker-compose.ci.yml
          echo "    healthcheck:" >> docker-compose.ci.yml
          echo "      test: ['CMD-SHELL', 'curl -f http://localhost:8081/actuator/health || exit 1']" >> docker-compose.ci.yml
          echo "      interval: 10s" >> docker-compose.ci.yml
          echo "      timeout: 5s" >> docker-compose.ci.yml
          echo "      retries: 5" >> docker-compose.ci.yml
          echo "volumes:" >> docker-compose.ci.yml
          echo "  postgres_data:" >> docker-compose.ci.yml

      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build API
        working-directory: ./backend/api
        run: mvn clean package -Dspring.profiles.active=ci -DskipTests

      - name: Start services with debug
        run: |
          docker-compose -f docker-compose.ci.yml up -d --build
          docker-compose -f docker-compose.ci.yml logs -f db > db.log 2>&1 & 
          sleep 15

      - name: Check database initialization
        run: |
          echo "=== Database logs ==="
          cat db.log || echo "No logs available"
          echo "=== Checking tables ==="
          docker-compose -f docker-compose.ci.yml exec db psql -U zadachok -d zadachok_db -c "\dt tp.*" || echo "Failed to check tables"
          echo "=== Checking init script execution ==="
          docker-compose -f docker-compose.ci.yml exec db ls -la /docker-entrypoint-initdb.d/

      - name: Wait for services
        run: |
          echo "🔄 Waiting for PostgreSQL..."
          timeout ${{ env.POSTGRES_TIMEOUT }}s bash -c '
            while ! docker-compose -f docker-compose.ci.yml exec db pg_isready -U zadachok; do
              echo "⏳ Waiting for PostgreSQL..."
              sleep 5
            done'
          echo "🔄 Waiting for API..."
          timeout ${{ env.API_TIMEOUT }}s bash -c '
            while ! docker-compose -f docker-compose.ci.yml exec api curl -s http://localhost:8081/actuator/health; do
              echo "⏳ API not ready yet..."
              docker-compose -f docker-compose.ci.yml logs api --tail=20
              sleep 5
            done'

      - name: Run Dart tests
        working-directory: ./api-tests
        env:
          API_URL: "http://localhost:${{ env.API_PORT }}"
        run: |
          dart pub get
          dart test

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.ci.yml down -v
          docker system prune -f
