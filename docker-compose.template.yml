version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_CONFIG_LOCATION: file:/app/config/
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/zadachok_db?currentSchema=tp
      SPRING_DATASOURCE_USERNAME: zadachok
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - ./backend/config/ci-application.properties:/app/config/application.properties
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: zadachok
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: zadachok_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zadachok -d zadachok_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
