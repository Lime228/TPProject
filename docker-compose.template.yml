version: '3.8'

services:
  db:
    container_name: tpproject-db
    image: postgres:17
    environment:
      POSTGRES_USER: zadachok
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zadachok}
      POSTGRES_DB: zadachok_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zadachok -d zadachok_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    container_name: tpproject-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      spring.profiles.active: ci
      server.address: 0.0.0.0
      spring.datasource.url: jdbc:postgresql://db:5432/zadachok_db?currentSchema=tp
      spring.datasource.username: zadachok
      spring.datasource.password: ${DB_PASSWORD:-zadachok}
      spring.jpa.hibernate.ddl-auto: validate
      spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      spring.jpa.properties.hibernate.default_schema: tp
      spring.jpa.show-sql: true
      jwt.secret: ${JWT_SECRET:-defaultSecret}
      jwt.expiration: 3600
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      
      retries: 5

volumes:
  postgres_data:
