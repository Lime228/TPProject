version: '3.8'

services:
  db:
    container_name: tpproject-db
    image: postgres:17
    environment:
      POSTGRES_USER: zadachok
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zadachok}
      POSTGRES_DB: zadachok_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zadachok -d zadachok_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    container_name: tpproject-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/zadachok_db?currentSchema=tp
      SPRING_DATASOURCE_USERNAME: zadachok
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-zadachok}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: true
      JWT_SECRET: ${JWT_SECRET:-defaultSecret}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: